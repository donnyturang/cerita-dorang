{{ define "main" }}

<div class="dorang-404">
  <div class="dorang-404-code">404</div>
  <h2 class="dorang-404-title">Halaman Tidak Ditemukan</h2>
  <p class="dorang-404-text">
    Sepertinya cerita yang Anda cari tidak ada di sini—mungkin sudah dipindahkan,
    dihapus, atau memang belum pernah ditulis.
  </p>

  {{/* Search Box */}}
  <div class="dorang-404-search">
    <p class="dorang-404-search-label">Coba cari yang Anda maksud:</p>
    <button type="button" class="dorang-404-search-box" data-open-search aria-label="Cari artikel">
      <svg class="dorang-404-search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <span class="dorang-404-search-placeholder">Ketik untuk mencari artikel...</span>
      <span class="dorang-404-search-key">Ctrl+K</span>
    </button>
  </div>

  <div class="dorang-404-actions">
    <a href="{{ site.Home.RelPermalink }}" class="dorang-404-btn">Kembali ke Beranda</a>
    <a href="/posts/" class="dorang-404-btn dorang-404-btn-outline">Lihat Semua Tulisan</a>
  </div>
</div>

{{ end }}
