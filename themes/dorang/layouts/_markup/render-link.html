{{- $url := .Destination -}}
{{- $isExternal := or (hasPrefix $url "http://") (hasPrefix $url "https://") -}}
{{- if $isExternal -}}
<a href="{{ $url | safeURL }}" target="_blank" rel="noopener noreferrer">{{ .Text | safeHTML }}</a>
{{- else -}}
<a href="{{ $url | safeURL }}">{{ .Text | safeHTML }}</a>
{{- end -}}
